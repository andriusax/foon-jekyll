backend:
  name: git-gateway
  branch: master

# Where uploaded images go in the repo and how they're referenced on the site
media_folder: "assets/images"
public_folder: "/assets/images"

site_url: "https://foon-music.netlify.app"
display_url: "https://foon-music.netlify.app"

collections:
  - name: shows
    label: "Shows"
    icon: "calendar"
    files:
      - name: shows
        label: "All shows"
        file: "_data/shows.yml"
        description: "Add, edit, reorder, or delete gigs. Past shows automatically move to the 'Past' section based on date."
        fields:
          - label: "Shows"
            name: "shows"
            widget: "list"
            summary: "{{fields.date}} — {{fields.venue}}, {{fields.place}}"
            fields:
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "Place / City", name: "place", widget: "string" }
              - { label: "Ticket URL", name: "url", widget: "string", required: false, default: "#" }

  - name: releases
    label: "Releases"
    icon: "media-alt"
    files:
      - name: releases
        label: "Release list"
        file: "_data/releases.yml"
        description: "Records and EPs shown on the Releases page. Leave a link empty to hide that button."
        fields:
          - label: "Releases"
            name: "releases"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Cover image", name: "cover", widget: "image", required: false, hint: "Square artwork works best" }
              - { label: "Listen URL", name: "listen_url", widget: "string", required: false, hint: "Spotify, Bandcamp, etc. Leave empty to hide the Listen button" }
              - { label: "Buy URL", name: "buy_url", widget: "string", required: false, hint: "Leave empty to hide the Buy button" }

  - name: about
    label: "About"
    icon: "user"
    files:
      - name: about
        label: "About page"
        file: "_data/about.yml"
        description: "The promo image, intro text, and member bios on the About page."
        fields:
          - { label: "Promo image", name: "image", widget: "image", required: false }
          - { label: "Intro text", name: "intro", widget: "markdown", hint: "Leave a blank line between paragraphs" }
          - label: "Member bios"
            name: "bios"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Instruments / role", name: "role", widget: "string", hint: "e.g. Saxophone, effects, electronics" }
              - { label: "Bio", name: "bio", widget: "text" }

  - name: videos
    label: "Videos"
    icon: "video"
    files:
      - name: videos
        label: "Video list"
        file: "_data/videos.yml"
        description: "Drag to reorder the videos shown on the Video page."
        fields:
          - label: "Videos"
            name: "videos"
            widget: "list"
            summary: "YouTube ID: {{fields.id}}"
            fields:
              - { label: "YouTube video ID", name: "id", widget: "string", hint: "The part after watch?v= in a YouTube URL" }
              - { label: "Start at (seconds)", name: "start", widget: "number", required: false, value_type: "int", min: 0, hint: "Leave blank to start from the beginning" }
