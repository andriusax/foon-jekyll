intro: |
  The musicians of the electro-acoustic duo Foon (fo:n) share a love of electronic music, and both have roots in the jazz and improvisation scene. As in jazz, the composed pieces performed on stage serve as a framework for new improvisations. After their intimate, hyper-focused performances, audiences are left in awe with, as one listener described it, "a melting brain and firing neurons."

  Foon was born in 2024 in Amsterdam and has since performed mainly in forward-thinking clubs such as Garage Noord and OT301, as well as on stages for alternative music and jazz such as Cinetol, de Roode Bioscoop, and Burgzicht. In 2026, the duo will release Everything Is, their debut EP.

bios:
  - name: "Ruben Kieftenbelt"
    role: "Modular synthesizer, electronics"
    bio: "Ruben has a background as a sound engineer in jazz, improvised, classical, and composed music. Working at renowned venues such as the Bimhuis and Muziekgebouw, he collaborated with many top musicians and immersed himself in music at the highest level. With Foon, he's now behind the controls on stage. He draws on his deep musical knowledge and, above all, his intimate understanding of what sound is and what it can mean."
  - name: "Andrius Dereviancenko"
    role: "Saxophone, effects, electronics"
    bio: "Saxophonist and composer Andrius was trained as a jazz musician. For many years, he has been a leading figure in Amsterdam's improvised music scene, bringing his love for free music into other genres, such as ska, reggae, and dub in his project 12 Tribes of Mars. With Foon, he finally gives his passion for electronic music free rein."
