<section class="home">
  <div class="lfo-glow" data-lfo-glow aria-hidden="true"></div>
  <div class="lfo" data-lfo>
    <div class="lfo__head">
      <span class="lfo__title">LFO</span>
      <span class="lfo__rate" data-lfo-rate>0%</span>
      <span class="lfo__readout" data-lfo-readout>0.07 Hz</span>
    </div>

    <div class="lfo__body">
      <div class="lfo__depth">
        <div class="lfo__depth-slot">
          <input type="range" min="0" max="1" step="0.001" value="0.03" data-lfo-depth aria-label="LFO depth" aria-orientation="vertical">
        </div>
        <span class="lfo__depth-label">DPTH</span>
      </div>

      <div class="lfo__main">
        <svg class="lfo__scope" data-lfo-scope viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true">
          <line class="lfo__scope-mid" x1="0" y1="50" x2="300" y2="50" vector-effect="non-scaling-stroke"></line>
          <polyline class="lfo__scope-trace" data-lfo-trace points="" vector-effect="non-scaling-stroke"></polyline>
          <line class="lfo__scope-dot" data-lfo-dot x1="299" y1="50" x2="299" y2="50" vector-effect="non-scaling-stroke"></line>
        </svg>

        <div class="lfo__waves" role="group" aria-label="Waveform">
          <button class="lfo__wave is-active" type="button" data-lfo-wave="sine" aria-pressed="true" aria-label="Sine">
            <svg viewBox="0 0 32 16" aria-hidden="true"><path d="M1,8 Q8.5,-2 16,8 T31,8" vector-effect="non-scaling-stroke"/></svg>
          </button>
          <button class="lfo__wave" type="button" data-lfo-wave="triangle" aria-pressed="false" aria-label="Triangle">
            <svg viewBox="0 0 32 16" aria-hidden="true"><polyline points="1,8 9,1 23,15 31,8" vector-effect="non-scaling-stroke"/></svg>
          </button>
          <button class="lfo__wave" type="button" data-lfo-wave="square" aria-pressed="false" aria-label="Square">
            <svg viewBox="0 0 32 16" aria-hidden="true"><polyline points="1,12 1,3 16,3 16,13 31,13 31,4" vector-effect="non-scaling-stroke"/></svg>
          </button>
          <button class="lfo__wave" type="button" data-lfo-wave="sawtooth" aria-pressed="false" aria-label="Sawtooth">
            <svg viewBox="0 0 32 16" aria-hidden="true"><polyline points="1,14 14,2 14,14 28,2 28,14" vector-effect="non-scaling-stroke"/></svg>
          </button>
          <button class="lfo__wave" type="button" data-lfo-wave="random" aria-pressed="false" aria-label="Random">
            <svg viewBox="0 0 32 16" aria-hidden="true"><polyline points="1,10 7,10 7,4 13,4 13,13 19,13 19,6 25,6 25,11 31,11" vector-effect="non-scaling-stroke"/></svg>
          </button>
        </div>

        <label class="lfo__freq">
          <span>FREQ</span>
          <input type="range" min="0" max="1" step="0.001" value="0.066" data-lfo-freq aria-label="LFO frequency">
        </label>
      </div>
    </div>
  </div>
</section>

<script src="{{ '/assets/js/lfo.js' | relative_url }}" defer></script>
